<nav class="bg-white-900 text-black shadow-lg shadow-blue-900/20 sticky top-0 z-50">
  <div class=" mx-auto px-4 sm:px-3 lg:px-4">
    <div class="flex  justify-between h-16 relative">

      <div class="flex-shrink-0 cursor-pointer flex items-center gap-2" routerLink="/">
        <div>
          <img src="/assets/images/vimek-logo.png" alt="logo" class="h-10 w-auto object-contain">
        </div>
        <span
          class="font-extrabold text-2xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-teal-600 to-blue-800">
          VIMEK RESTOMART
        </span>
      </div>
      <div class="relative mt-2 w-36 p-2 pl-10">
        <!-- Current Location Button -->
        <button 
          (click)="toggleDropdown()"
          class="flex  flex-col gap-1 font-medium  "
        >
        <span class="text-xs text-gray-400">
          Delivery in <i class="pi pi-map-marker text-sm" style="color: red;"></i>
        </span>
        <span class="flex items-center gap-1 font-semibold">
         
          {{ selectedLocation }}
          <span class="text-xs"><i class="pi pi-angle-down" style="color: teal;"></i></span>
        </span>
        </button>

        <!-- Dropdown -->
        <div 
          *ngIf="isOpen"
          class="absolute left-0 mt-2 w-44 bg-white shadow-lg rounded-lg border z-50"
        >
          <div 
            *ngFor="let loc of locations"
            (click)="selectLocation(loc)"
            class="px-4 py-2 hover:bg-gray-100 cursor-pointer"
          >
            {{ loc }}
          </div>
        </div>
      </div>
      <!-- Search Bar -->
      <div class="flex-1 flex items-center justify-center px-6 max-w-lg mx-auto">
        <div class="relative w-full">
          <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 0 5 11a6 6 0 0 0 12 0z" />
            </svg>
          </span>
          <input
            pInputText
            type="text"
            [(ngModel)]="searchQuery"
            (keyup.enter)="onSearch()"
            placeholder="Search products..."
            class="!pl-10 !pr-10 !py-2 !w-full !rounded-full !bg-gray-50"
          />
          @if (searchQuery) {
            <button
              (click)="searchQuery = ''"
              class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600 " 
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          }
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <button class="relative p-2 rounded-full hover:bg-teal/10 transition-colors duration-200 group">
         <i class="pi pi-shopping-cart " style="color:teal; font-size: 1.5rem"></i>
          <span
            class="absolute top-0 right-0 inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-red-500 border-2 border-white rounded-full transition-all duration-200"
            [class.opacity-0]="cartService.totalItems() === 0"
            [class.scale-0]="cartService.totalItems() === 0"
          >{{ cartService.totalItems() }}</span>
        </button>
       
       <button pButton type="button" label="Login/Signup" routerLink="/auth/restaurant" class="!bg-gradient-to-r from-teal-400 to-blue-600"></button>
      </div>

    </div>
  </div>
</nav>
